name: Link Check

on:
  push:
    paths: ['**.md']
  pull_request:
    paths: ['**.md']
  schedule:
    - cron: '0 6 1 * *'   # monthly, on the 1st
  workflow_dispatch:

jobs:
  lychee:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Publishers bot-block automated requests, so 403/429 are accepted
          # rather than treated as failures. Three hosts fail regardless and are
          # excluded outright, since flagging them every run trains maintainers
          # to ignore the issue: Elsevier answers CI IPs with 400, the AAAI
          # servers negotiate HTTP/2 incorrectly, and the star-history image API
          # 500s under load. All were verified by hand to resolve in a browser.
          args: >-
            --no-progress
            --accept 200,202,206,403,429
            --exclude-path .github
            --exclude 'sciencedirect\.com'
            --exclude 'ojs\.aaai\.org'
            --exclude 'doi\.org/10\.1609'
            --exclude 'api\.star-history\.com'
            --max-concurrency 4
            --max-retries 2
            --retry-wait-time 5
            --timeout 30
            './**/*.md'
          fail: false

      - name: Open an issue on failure
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken links found
          content-filepath: ./lychee/out.md
          labels: broken-links, automated
